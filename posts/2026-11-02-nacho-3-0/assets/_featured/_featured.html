<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Source Sans 3"; src: url("SourceSans3-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1a2533; font-family: "Source Sans 3", "Helvetica Neue", sans-serif; }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(90deg, #fdb347, #e0503a); }
  .text { position: absolute; left: 70px; top: 150px; width: 440px; color: #fff; }
  .text img { height: 110px; }
  h1 { margin: 22px 0 0; font-size: 92px; line-height: 1; font-weight: 700; }
  h1 span { color: #fdb347; }
  p { margin: 20px 0 0; font-size: 30px; line-height: 1.25; color: #c9d1da; }
  .shot { position: absolute; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); overflow: hidden; }
  .shot img { display: block; width: 100%; }
  .old { left: 520px; top: 120px; width: 400px; opacity: 0.85; }
  .new { left: 640px; top: 230px; width: 500px; }
  .tag { position: absolute; font-size: 22px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="text">
  <img src="nacho_hex.png" alt="">
  <h1>NACHO <span>3.0</span></h1>
  <p>A new object, app and report.</p>
</div>
<div class="shot old"><img src="../media/app-old-qc.webp" alt=""></div>
<div class="tag" style="left: 524px; top: 82px;">NACHO 2.0</div>
<div class="shot new"><img src="../media/app-new-qc-dark.webp" alt=""></div>
<div class="tag" style="left: 960px; top: 192px; color: #fdb347;">NACHO 3.0</div>
</body>
</html>

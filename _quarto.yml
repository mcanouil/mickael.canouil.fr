project:
  type: mickaelcanouilfr
  # The `.ejs.md` files under `assets/listing-templates` are listing templates,
  # not pages: rendering them published stub pages and emitted an
  # "Invalid URI" warning for every EJS placeholder in their markup.
  render:
    - "**/*.qmd"
  pre-render:
    - publications/publications.ts
  # Quarto copies only these globs, plus files it finds behind an `href` or a
  # `src` in the rendered HTML. The manifest names its icons in JSON, which is
  # not scanned, so they are listed here.
  # The leading slash anchors a glob to the project root: a bare `favicon.ico`
  # also matches the copies `renv` keeps under `renv/library/.../httpgd/www`,
  # and publishes the whole tree that leads to them.
  resources:
    - _headers
    - /favicon.ico
    - /site.webmanifest
    - /assets/images/icon-*.png

website:
  title: "Mickaël CANOUIL"
  description: "A data science blog and portfolio by Mickaël CANOUIL"
  image: /assets/images/og-image.png
  image-alt: "Social preview card: a gold MC monogram above the Mickaël CANOUIL wordmark in gold script and small capitals, over a near-black background, with the line 'Biostatistician, Quarto wizard, and cinephile.' beneath a thin gold rule."
  favicon: favicon.ico
  site-url: &site-url https://mickael.canouil.fr
  repo-url: https://github.com/mcanouil/mickael.canouil.fr
  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto title="Quarto Logo" label="Quarto Logo" >}} Quarto](https://quarto.org){target="_blank" rel="noopener noreferrer"}.
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr){target="_blank" rel="noopener noreferrer"}. [{{< iconify octicon:heart-fill-16 title="Heart" label="Heart" >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb){target="_blank" rel="noopener noreferrer"}.
    right: |
      License: [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0){target="_blank" rel="noopener noreferrer"}.
  navbar:
    right:
      - text: About
        href: index.qmd
      - text: Blog
        href: blog.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: '{{< iconify fa7-brands:bluesky title="BlueSky" label="BlueSky" >}}'
        href: "https://bsky.app/profile/mickael.canouil.fr"
        target: _blank
        rel: noopener noreferrer
        aria-label: "BlueSky profile"
      - text: '{{< iconify fa7-brands:linkedin title="LinkedIn" label="LinkedIn" >}}'
        href: "https://www.linkedin.com/in/mickaelcanouil"
        target: _blank
        rel: noopener noreferrer
        aria-label: "LinkedIn profile"
      - text: '{{< iconify fa7-brands:mastodon title="Mastodon" label="Mastodon" >}}'
        href: "https://fosstodon.org/@MickaelCanouil"
        target: _blank
        rel: noopener noreferrer me
        aria-label: "Mastodon profile"
      - text: '{{< iconify octicon:mark-github-16 title="GitHub" label="GitHub" >}}'
        href: "https://github.com/mcanouil"
        target: _blank
        rel: noopener noreferrer
        aria-label: "GitHub profile"
      - text: '{{< iconify octicon:heart-fill-16 title="GitHub Sponsor" label="GitHub Sponsor" >}}'
        href: "https://github.com/sponsors/mcanouil?o=esb"
        target: _blank
        rel: noopener noreferrer
        aria-label: "GitHub Sponsor"

lightbox: auto

execute:
  freeze: true

filters:
  - at: pre-quarto
    path: include-code-files
  - at: pre-quarto
    path: typst-render
  - at: pre-quarto
    path: code-window
  - at: post-quarto
    path: gitlink

extensions:
  typst-render:
    output-directory: ./typst-render
    dpi: 300
    format: png
  # Quarto keeps the `website` block out of the metadata it hands to Lua
  # filters, so `social-metadata.lua` cannot read `website.site-url` to build
  # `og:url`. The anchor above republishes the same scalar here, without a
  # second copy of the string. The remaining keys are the head links Quarto
  # has no configuration for; `website.favicon` still emits the `.ico` one.
  mickaelcanouilfr:
    site-url: *site-url
    icon: assets/images/icon.svg
    apple-touch-icon: assets/images/apple-touch-icon.png
    manifest: site.webmanifest
    theme-color:
      light: "#fafafa"
      dark: "#161616"

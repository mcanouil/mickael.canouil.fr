name: Update Pull Request

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update-pr:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/update-pr')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Get Pull Request Details
        id: pr-details
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_DATA=$(gh pr view "${ISSUE_NUMBER}" --json headRefName,baseRefName --repo "${GITHUB_REPOSITORY}")
          HEAD_REF=$(echo "${PR_DATA}" | jq -r .headRefName)
          BASE_REF=$(echo "${PR_DATA}" | jq -r .baseRefName)

          echo "head-ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
          echo "base-ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-details.outputs.head-ref }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Update PR Branch with Base Branch
        id: merge
        env:
          BASE_REF: ${{ steps.pr-details.outputs.base-ref }}
        run: |
          git fetch origin "${BASE_REF}"

          # Attempt a real merge (keeps ${BASE_REF} as a parent so GitHub sees the branch updated)
          if git merge "origin/${BASE_REF}" --no-edit -m "ci: update PR branch with ${BASE_REF}"; then
            echo "merge-status=success" >> "${GITHUB_OUTPUT}"
            echo "Merge completed cleanly"
          else
            # _site is generated per-branch: take ${BASE_REF}'s version wholesale for any conflict
            if git diff --name-only --diff-filter=U | grep -q "^_site/"; then
              echo "Resolving _site conflicts using ${BASE_REF}"
              rm -rf _site
              git checkout "origin/${BASE_REF}" -- _site
              git add -A _site
            fi

            # Any remaining conflicts are outside _site and require manual resolution
            if git diff --name-only --diff-filter=U | grep -q .; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              echo "merge-status=conflict" >> "${GITHUB_OUTPUT}"
              {
                echo "conflicts<<EOF"
                echo "${CONFLICTS}"
                echo "EOF"
              } >> "${GITHUB_OUTPUT}"
              git merge --abort
              exit 1
            fi

            # Only _site conflicts remained; complete the merge commit
            git commit --no-edit
            echo "merge-status=success" >> "${GITHUB_OUTPUT}"
            echo "Merge completed with _site taken from ${BASE_REF}"
          fi

      - name: Push Updated Branch
        if: ${{ steps.merge.outputs.merge-status == 'success' }}
        env:
          HEAD_REF: ${{ steps.pr-details.outputs.head-ref }}
        run: |
          git push origin "${HEAD_REF}"

      - name: Update Comment on Success
        if: ${{ steps.merge.outputs.merge-status == 'success' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BASE_REF: ${{ steps.pr-details.outputs.base-ref }}
          ORIGINAL_BODY: ${{ github.event.comment.body }}
        run: |
          gh api \
            --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body="${ORIGINAL_BODY}

          ---

          ✅ Successfully updated PR branch with \`${BASE_REF}\` (keeping all \`_site\` changes from base branch)"

      - name: Update Comment on Conflict
        if: ${{ failure() && steps.merge.outputs.merge-status == 'conflict' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BASE_REF: ${{ steps.pr-details.outputs.base-ref }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          ORIGINAL_BODY: ${{ github.event.comment.body }}
        run: |
          gh api \
            --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body="${ORIGINAL_BODY}

          ---

          ❌ Unable to automatically update PR branch with \`${BASE_REF}\` due to conflicts.

          **Conflicting files:**
          \`\`\`
          ${CONFLICTS}
          \`\`\`

          Please update the PR branch manually by running:
          \`\`\`bash
          git fetch origin ${BASE_REF}
          git merge origin/${BASE_REF}
          # Resolve conflicts
          git add .
          git commit
          git push
          \`\`\`"

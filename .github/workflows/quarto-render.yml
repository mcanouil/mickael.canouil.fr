name: Quarto Render

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Quarto version"
        required: true
        default: "pre-release"
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "_site/**"
      - ".github/**"
      - "_extensions/**"
  schedule:
    - cron: 00 12 1 * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quarto-render:
    if: ${{ !endsWith(github.actor, '[bot]') && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      # - uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     packages: any::knitr
      #       any::rmarkdown
      #       any::downlit
      #       any::xml2
      #       any::webshot2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ inputs.version || 'pre-release' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Provision Python and Jupyter
        shell: bash
        run: |
          uv venv --python 3.13 .venv
          . .venv/bin/activate
          uv pip install jupyter polars ipython
          python -m ipykernel install --user --name python3 --display-name "Python 3"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
          echo "QUARTO_PYTHON=${PWD}/.venv/bin/python" >> "${GITHUB_ENV}"

      - name: Render Quarto Project
        shell: bash
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
        run: |
          sed -i "s|{{GISCUS_REPO_ID}}|${GISCUS_REPO_ID}|g" posts/_metadata.yml
          sed -i "s|{{GISCUS_REPO}}|${GISCUS_REPO}|g" posts/_metadata.yml
          sed -i "s|{{GISCUS_CATEGORY_ID}}|${GISCUS_CATEGORY_ID}|g" posts/_metadata.yml
          sed -i "s|{{GISCUS_CATEGORY}}|${GISCUS_CATEGORY}|g" posts/_metadata.yml

          [ ! -f _quarto.yml ] && echo -e "project:\n  output-dir: _site" > _quarto.yml
          if grep -q "output-dir: _site" _quarto.yml; then
            quarto render
          else
            quarto render --output-dir _site
          fi

      - name: Push the render to the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          base: ${{ github.head_ref }}
          files: |
            _site
            _freeze
          message: |
            ci: quarto automatic render

            skip-checks: true
          allow-unchanged: true

      - name: Open the render pull request
        if: ${{ github.event_name != 'pull_request' }}
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: |
            _site
            _freeze
          message: "ci: quarto automatic render"
          branch: ci/latest-quarto-updates
          body: "GitHub Actions: ${{ github.workflow }} (${{ github.sha }})"
          merge: none
          allow-unchanged: true
          token: ${{ steps.token.outputs.token }}

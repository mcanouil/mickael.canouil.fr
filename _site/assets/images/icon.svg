<?xml version="1.0" encoding="UTF-8"?>
<!--
  MC monogram, master icon for mickael.canouil.fr.

  The glyphs are the same faces as the wordmark in `logo-gold-path.svg`: the M
  is Dancing Script at weight 700, the C is Alegreya SC at weight 700, both
  SIL Open Font License. They are outlined, so the file needs no font installed.

  Regenerate the outlines by running Inkscape on a `glyphs.svg` that sets the
  two letters at font-size 240 in those faces, with the `export-text-to-path`,
  `export-plain-svg`, and `export-filename` options. XML forbids a double
  hyphen in a comment, hence the option names without their leading dashes.
  The transform below scales the pair to the 32 grid with a 0.5 unit inset.

  The field flips with the browser theme, the glyphs stay CV gold in both.

  Every raster in this directory, and `favicon.ico` at the project root, is
  derived from this file by the icon block at the top of `render.sh`.

  @license MIT
  @copyright 2026 Mickaël Canouil
  @author Mickaël Canouil
-->

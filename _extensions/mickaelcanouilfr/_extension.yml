title: Mickaël Canouil — Website Format
author: Mickaël Canouil
version: 0.1.0
quarto-required: ">=1.9.37"
contributes:
  formats:
    html:
      grid:
        body-width: 1000px
        sidebar-width: 250px
        margin-width: 250px
      theme:
        light:
          - scss/mickaelcanouilfr.scss
        dark:
          - scss/mickaelcanouilfr.scss
          - scss/_dark.scss
      include-before-body:
        - assets/scripts/skip-link.html
      include-after-body:
        - assets/scripts/base64.html
        - assets/scripts/email.html
        - assets/scripts/publications-clipboard.html
        - assets/scripts/year-toc.html
        - assets/scripts/section-rail.html
        - assets/scripts/ordinal-dates.html
        - assets/scripts/navbar-tooltips.html
        - assets/scripts/title-block-header.html
        - assets/scripts/a11y-fixes.html
      template-partials:
        - _partials/_title-meta-author.html
      filters:
        - filters/current-year.lua
        - filters/social-metadata.lua
        # Runs late so it also catches the links other filters generate. It
        # still cannot reach the `about` block, which Quarto builds before the
        # Lua pipeline; those hrefs carry their own encoded payload.
        - at: post-quarto
          path: filters/email-obfuscation.lua
      lang: en-GB
      # Quarto builds the canonical link from `website.site-url`, giving a
      # directory index the URL of its directory. Set `canonical-url: false`
      # on a page served from more than one URL, such as `404.qmd`.
      canonical-url: true
      date-format: "dddd[, the] Do [of] MMMM, YYYY"
      anchor-sections: true
      email-obfuscation: javascript
      link-external-newwindow: true
      fig-align: center
      code-copy: true
      code-overflow: wrap
      code-link: false
      code-tools:
        source: false
        toggle: false
        caption: none
      syntax-highlighting:
        light: github-light
        dark: github-dark
  project:
    project:
      type: website
    website:
      back-to-top-navigation: true
      page-navigation: true
      open-graph:
        locale: en_GB
      twitter-card:
        card-style: summary_large_image
      repo-actions: [edit, issue]
      repo-link-target: _blank
      repo-link-rel: noopener noreferrer
      navbar:
        search: true
        background: dark
        foreground: light
        logo:
          light: assets/images/logo-gold-path.svg
          dark: assets/images/logo-gold-path.svg
        logo-alt: Mickaël CANOUIL logo
      page-footer:
        border: true
        background: dark
        foreground: light
    format: mickaelcanouilfr-html

<script id="section-rail" type="text/javascript">
  /**

   * @copyright 2026 Mickaël Canouil
   * @author Mickaël Canouil
   */
  document.addEventListener("DOMContentLoaded", () => {
    if (!document.body.classList.contains("home-page")) return;

    const sections = Array.from(document.querySelectorAll(".about-body section.level2[id]"));
    if (sections.length === 0) return;

    const list = document.createElement("ul");
    const anchors = new Map();

    sections.forEach((section) => {
      const heading = section.querySelector("h2");
      if (!heading) return;

      const icon = heading.querySelector("iconify-icon");
      const label = Array.from(heading.childNodes)
        .filter((node) => node !== icon)
        .map((node) => node.textContent)
        .join("")
        .trim();
      if (label === "") return;

      const link = document.createElement("a");
      link.className = "mc-section-rail__link";
      link.setAttribute("href", `#${section.id}`);

      // Built fresh rather than cloned, so the rail carries only the icon name
      // and never inherits whatever accessibility attributes a heading icon
      // happens to have; the whole mark is hidden and the label names the link.
      const mark = document.createElement("span");
      mark.className = "mc-section-rail__mark";
      mark.setAttribute("aria-hidden", "true");
      const iconName = icon?.getAttribute("icon");
      if (iconName) {
        const railIcon = document.createElement("iconify-icon");
        railIcon.setAttribute("icon", iconName);
        mark.appendChild(railIcon);
      }
      link.appendChild(mark);

      const text = document.createElement("span");
      text.className = "mc-section-rail__label";
      text.textContent = label;
      link.appendChild(text);

      const item = document.createElement("li");
      item.appendChild(link);
      list.appendChild(item);
      anchors.set(section.id, link);
    });

    if (anchors.size === 0) return;

    const nav = document.createElement("nav");
    nav.id = "mc-section-rail";
    nav.className = "mc-section-rail";
    nav.setAttribute("aria-label", "Page sections");
    nav.appendChild(list);

    // Placed before `main` so the tab order matches what the reader sees: the
    // rail is painted at the top right, and appending to `body` would put it
    // behind the whole page and the footer. It is `position: fixed`, so where
    // it sits in the DOM does not move it.
    const main = document.querySelector("main");
    if (main && main.parentNode) {
      main.parentNode.insertBefore(nav, main);
    } else {
      document.body.appendChild(nav);
    }

    // In the bottom dock the list scrolls sideways, so the active chip is
    // brought to the middle. Setting `scrollLeft` rather than calling
    // `scrollIntoView` keeps the page itself where the reader left it, and the
    // jump is deliberately instant: the dock retargets on every section the
    // reader scrolls past, and a smooth scroll each time reads as fidgeting.
    const centreInDock = (link) => {
      if (list.scrollWidth <= list.clientWidth + 1) return;
      list.scrollLeft = link.offsetLeft + link.offsetWidth / 2 - list.clientWidth / 2;
    };

    let activeId = null;
    const setActive = (targetId) => {
      if (activeId === targetId) return;
      const previous = anchors.get(activeId);
      if (previous) {
        previous.classList.remove("active");
        previous.removeAttribute("aria-current");
      }
      const current = anchors.get(targetId);
      if (current) {
        current.classList.add("active");
        current.setAttribute("aria-current", "true");
        centreInDock(current);
      }
      activeId = targetId;
    };

    const tracked = sections.filter((section) => anchors.has(section.id));

    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver(
        (entries) => {
          const visible = entries
            .filter((e) => e.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
          if (visible.length > 0) {
            setActive(visible[0].target.id);
          }
        },
        { rootMargin: "-20% 0px -70% 0px", threshold: 0 },
      );
      tracked.forEach((section) => observer.observe(section));

      // The footer is not fixed, so it scrolls up under the rail at the end of
      // the page, and shares its ink background. Retreat while it is in view.
      const footer = document.querySelector("footer.footer");
      if (footer) {
        const footerObserver = new IntersectionObserver(
          ([entry]) => {
            nav.classList.toggle("mc-section-rail--tucked", entry.isIntersecting);
          },
          { threshold: 0 },
        );
        footerObserver.observe(footer);
      }
    }

    // Seed from the fragment when the reader arrives on a deep link, so the
    // rail does not announce the first section while they are somewhere else.
    const landed = decodeURIComponent(window.location.hash.replace(/^#/, ""));
    setActive(anchors.has(landed) ? landed : tracked[0].id);
  });
</script>

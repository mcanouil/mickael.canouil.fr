<?xml version="1.0" encoding="UTF-8"?>
<!--
  Small icon for mickael.canouil.fr: an M drawn as a bimodal density curve.

  The curve has two peaks, so it reads as an M. A baseline runs below it,
  and a dot on the baseline marks the trough between the peaks.
  The geometry is on the 32 grid, so the mark stays sharp at 16 and 32 px.

  This file is the editable source, in the `assets/brand` folder.
  The shapes use three colour roles: `field`, `accent`, and `letter`.
  `assets/brand/build.sh` replaces the style block with the colours of a
  preset, and writes the result to the folder you give it.
  The field flips with the browser theme. The accent stays the same.

  @license MIT
  @copyright 2026 Mickaël Canouil
  @author Mickaël Canouil
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Mickaël Canouil</title>
  <style>
    .field { fill: #111827; }
    .accent { fill: #b5830a; stroke: #b5830a; }
    .letter { fill: #f5f5f4; stroke: #f5f5f4; }
    @media (prefers-color-scheme: dark) {
      .field { fill: #f5f5f4; }
      .letter { fill: #111827; stroke: #111827; }
    }
  </style>
  <rect class="field" width="32" height="32" rx="7"/>
  <path class="accent" style="stroke: none" opacity="0.22" d="M4 23 C7 23 8 8 11 8 C13.5 8 14 16 16 16 C18 16 18.5 8 21 8 C24 8 25 23 28 23 Z"/>
  <path class="accent" style="fill: none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 23 C7 23 8 8 11 8 C13.5 8 14 16 16 16 C18 16 18.5 8 21 8 C24 8 25 23 28 23"/>
  <line class="letter" x1="4" y1="25" x2="28" y2="25" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <circle class="letter" style="stroke: none" cx="16" cy="25" r="1.5"/>
</svg>

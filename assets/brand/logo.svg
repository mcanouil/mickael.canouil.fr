<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wordmark of mickael.canouil.fr: the first name in a script face, a rule
  with a dot, and the family name in small capitals.

  This file is the editable source, in the `assets/brand` folder.
  `assets/brand/build.sh` sets the two faces, turns the text into paths with
  Inkscape, and writes one file for each colour, so the results need no font.
  The faces here are the defaults: Dancing Script and Alegreya SC.
  The colour `#010203` is a placeholder that the build replaces.

  @license MIT
  @copyright 2026 Mickaël Canouil
  @author Mickaël Canouil
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Mickaël Canouil</title>
  <text id="script" x="155.15" y="50.33" text-anchor="middle" font-family="Dancing Script" font-size="42.67" fill="#010203">Mickaël</text>
  <line x1="106.94" y1="63.22" x2="152.94" y2="63.22" stroke="#010203" stroke-width="0.75"/>
  <line x1="160.94" y1="63.22" x2="206.94" y2="63.22" stroke="#010203" stroke-width="0.75"/>
  <circle cx="156.94" cy="63.22" r="2.5" fill="#010203"/>
  <text id="capitals" x="149.23" y="98.77" text-anchor="middle" font-family="Alegreya SC" font-size="40.63" letter-spacing="11" fill="#010203">CANOUIL</text>
</svg>
